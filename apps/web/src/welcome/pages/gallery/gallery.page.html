@let locations = locations$ | async | default:[];
@let selected = selectedLocation();

<app-dual-pane>
  <app-location-listing class="secondary"
                        [locations]="locations"
                        [selectedLocation]="selected"
                        (locationClicked)="onLocationSelected($event)" />

  <app-image-grid class="primary"
                  [location]="selected"
                  [contents]="contents()" />
</app-dual-pane>
