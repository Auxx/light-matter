@let image = imageElement();

<!-- eslint-disable-next-line @angular-eslint/template/mouse-events-have-key-events -->
<div class="container"
     [class.visible]="isVisible()">

<!--  <div class="container"-->
<!--     (mouseover)="isVisible.set(true)"-->
<!--     (mouseout)="isVisible.set(false)"-->
<!--     [class.visible]="isVisible()">-->

  <div class="file-name">
    {{ fileName() | fileName }}
  </div>

  <div class="actions">
    <button title="Back to Dashboard"
            routerLink="/welcome">
      <ui-icon icon="dismissCircle" size="large"/>
    </button>

    <app-vertical-divider />

    <button title="Previous image (Left)"
            [disabled]="prev() === -1"
            (click)="navigatePrev.emit()">
      <ui-icon icon="chevronLeft" size="large"/>
    </button>

    <button title="Fit to screen"
            [class.active]="fit() === 'contain'"
            (click)="fitChange.emit('contain')">
      <ui-icon icon="scaleFit" size="large"/>
    </button>

    <button title="Original size"
            [class.active]="fit() === 'original'"
            (click)="fitChange.emit('original')">
      <ui-icon icon="scanCamera" size="large"/>
    </button>

    <button title="Next image (Right)"
            [disabled]="next() === -1"
            (click)="navigateNext.emit()">
      <ui-icon icon="chevronRight" size="large"/>
    </button>

    <app-vertical-divider />

    <button title="Toggle full screen mode (F)"
            [class.active]="isFullScreen()"
            (click)="toggleFullScreen.emit()">
      <ui-icon icon="fullScreenMaximize" size="large"/>
    </button>
  </div>

  <div class="misc">
    @if (image !== null) {
      {{ image.width }} x {{ image.height }}
    }
  </div>

</div>
