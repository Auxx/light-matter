@let location = selectedLocation();
@let sortType = sortBy();
@let sortDir = sortDirection();

<ui-toolbar>
  <ui-title>
    @if (location === null) {
      No location selected
    } @else {
      {{ location }}
    }
  </ui-title>

  <aside>
    <ui-action-button class="action"
                      [cdkMenuTriggerFor]="sortMenu"
                      uiStopPropagation>
      <ui-icon icon="arrowSort" [inherit]="true" />
      <ui-icon icon="chevronDown" [inherit]="true" size="small" />
    </ui-action-button>
  </aside>
</ui-toolbar>

<div class="wrapper" #scrollBox>
  <app-images [images]="images()"
              [sortBy]="sortBy()"
              (selected)="selected.emit($event)" />
</div>

<ng-template #sortMenu>
  <ui-popup-menu cdkMenu>

    <ui-action-button cdkMenuItem
                      (pressed)="sortByChanged.emit('date')">
      <ui-icon [icon]="sortType === 'date' ? 'circleSmallFilled' : 'EMPTY'" [inherit]="true" />
      <ui-icon icon="calendar" [inherit]="true" />
      <ui-text [inherit]="true">Date</ui-text>
    </ui-action-button>

    <ui-action-button cdkMenuItem
                      (pressed)="sortByChanged.emit('name')">
      <ui-icon [icon]="sortType === 'name' ? 'circleSmallFilled' : 'EMPTY'" [inherit]="true" />
      <ui-icon icon="text" [inherit]="true" />
      <ui-text [inherit]="true">Name</ui-text>
    </ui-action-button>

    <ui-action-button cdkMenuItem
                      (pressed)="sortByChanged.emit('size')">
      <ui-icon [icon]="sortType === 'size' ? 'circleSmallFilled' : 'EMPTY'" [inherit]="true" />
      <ui-icon icon="save" [inherit]="true" />
      <ui-text [inherit]="true">Size</ui-text>
    </ui-action-button>

    <ui-menu-separator />

    <ui-action-button cdkMenuItem
                      (pressed)="sortDirChanged.emit('asc')">
      <ui-icon [icon]="sortDir === 'asc' ? 'circleSmallFilled' : 'EMPTY'" [inherit]="true" />
      <ui-icon icon="arrowSortUp" [inherit]="true" />
      <ui-text [inherit]="true">Ascending</ui-text>
    </ui-action-button>

    <ui-action-button cdkMenuItem
                      (pressed)="sortDirChanged.emit('desc')">
      <ui-icon [icon]="sortDir === 'desc' ? 'circleSmallFilled' : 'EMPTY'" [inherit]="true" />
      <ui-icon icon="arrowSortDown" [inherit]="true" />
      <ui-text [inherit]="true">Descending</ui-text>
    </ui-action-button>

  </ui-popup-menu>
</ng-template>
