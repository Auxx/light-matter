@let path = selectedPath();

<ui-toolbar>
  @if (path.length > 1) {
    <ui-action-button (pressed)="folderPopped.emit()">
      <ui-icon icon="chevronLeft" size="large" [inherit]="true" />
    </ui-action-button>
  }

  <ui-title>
    @if (path.length === 0) {
      No location selected
    } @else {
      {{ path[ path.length - 1 ] }}
    }
  </ui-title>
</ui-toolbar>

<div class="wrapper">
  <app-images [contents]="files()" />
</div>
