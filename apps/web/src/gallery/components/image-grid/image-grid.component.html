@let location = selectedLocation();

<ui-toolbar>
  <ui-title>
    @if (location === null) {
      No location selected
    } @else {
      {{ location }}
    }
  </ui-title>
</ui-toolbar>

<div class="wrapper">
  <app-images [images]="images()"
              (selected)="selected.emit($event)" />
</div>
