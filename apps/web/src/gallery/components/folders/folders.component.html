<ul>
  @for (item of contents(); track item.name) {
    <li>
      <button (click)="clicked.emit(item)">
        <span class="spacer"></span>
        <ui-icon icon="folderFilled" size="large"/>
        <span class="spacer"></span>
        <span class="label">{{ item.name }}</span>
      </button>
    </li>
  }
</ul>
