@let imageList = images();

@if (imageList === null || imageList.length === 0) {
  <p>No images found in this folder.</p>
} @else {
  <div class="images">
    @for (image of imageList; track image.name) {
      <app-thumbnail [image]="image"
                     (clicked)="this.selected.emit($event)" />
    }
  </div>
}
