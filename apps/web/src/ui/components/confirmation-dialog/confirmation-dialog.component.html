<h2 mat-dialog-title>{{ options.title }}</h2>

<mat-dialog-content>
  <p>{{ options.description }}</p>
</mat-dialog-content>

<mat-dialog-actions>
  <button matButton [mat-dialog-close]="false">Cancel</button>
  <button matButton [mat-dialog-close]="true" cdkFocusInitial>Yes</button>
</mat-dialog-actions>
