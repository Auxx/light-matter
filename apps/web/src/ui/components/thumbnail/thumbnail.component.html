@if (isLoading()) {
  <div class="message">
    <ui-caption>Loading...</ui-caption>
  </div>
}

@if (hasError()) {
  <div class="message">
    <ui-caption variant="warn">Failed to load an image</ui-caption>
  </div>
}

<button [title]="image().name"
        (click)="clicked.emit(image())">

  <img #imageTag
       loading="lazy"
       [alt]="image().name"
       [src]="url()" />

</button>
