@let loading = isLoading();
@let error = hasError();

@if (loading) {
  <div class="message">
    <ui-caption>Loading...</ui-caption>
  </div>
}

@if (error) {
  <div class="message">
    <ui-caption variant="warn">Failed to load an image</ui-caption>
  </div>
}

@if (!loading && !error) {
  <button [title]="image().name"
          (click)="clicked.emit(image())">

    <img loading="lazy"
         [alt]="image().name"
         [src]="url()" />

  </button>
}
